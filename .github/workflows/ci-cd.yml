name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install Python deps
        run: pip install -r requirements-docker.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app/ tests/
      - name: Generate data + train classifier
        run: |
          python data/generate_dataset.py
          python train_severity_classifier.py
      - name: Run security tests first
        env:
          JWT_SECRET_KEY: ci_test_secret_key_not_for_prod
        run: pytest -m security -v
      - name: Run unit tests
        env:
          JWT_SECRET_KEY: ci_test_secret_key_not_for_prod
        run: pytest -m unit -v
      - name: Run integration tests
        env:
          JWT_SECRET_KEY: ci_test_secret_key_not_for_prod
        run: pytest -m integration -v
      - name: Static security scan (SAST)
        run: |
          pip install bandit
          bandit -r app/ -f screen
      - name: Dependency vulnerability scan (SCA)
        run: |
          pip install pip-audit
          pip-audit

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t requirement-auditor:${{ github.sha }} .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "requirement-auditor:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # start non-blocking; flip to "1" once the baseline findings are triaged

  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='${HF_TOKEN}')
          api.upload_folder(
              folder_path='.',
              repo_id='YOUR_HF_USERNAME/requirement-drift-auditor',
              repo_type='space',
              ignore_patterns=['.git*', 'venv/*', '*.db']
          )
          "
